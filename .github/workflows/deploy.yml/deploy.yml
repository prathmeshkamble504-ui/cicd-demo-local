name: Local CI/CD

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Simulate Deploy
        run: |
          echo "Deploying code..."
          mkdir C:\deploy-server || echo "Already exists"
          xcopy . C:\deploy-server /E /H /C /I /Y

      - name: Done
        run: echo "Code deployed to deploy-server"